stages:
  - init
  - build
  - deploy

image:
  name: hashicorp/terraform:latest
  entrypoint: [""]

variables:
  TF_VAR_env_prefix: "dev"
  TF_VAR_runner_registration_token: $RUNNER_TOKEN

init:
  stage: init
  script:
    - terraform init
  artifacts:
    paths:
      - .terraform/
      - .terraform.lock.hcl

build:
  stage: build
  script:
    - terraform plan -out="terraform.tfplan"
  artifacts:
    paths:
      - terraform.tfplan

deploy:
  stage: deploy
  script:
    - terraform apply "terraform.tfplan"
  when: manual